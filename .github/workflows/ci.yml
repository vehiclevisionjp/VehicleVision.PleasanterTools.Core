name: ci

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      # 配布できる形になっているかを、公開しなくても確かめる
      - run: dotnet pack -c Release --no-build -o artifacts

  sdk-consistency:
    # 各アプリと SDK 指定がずれていないかを見張る（ばらつきの再発防止）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: global.json が基準と一致するか
        run: |
          expected='{"sdk":{"version":"10.0.100","allowPrerelease":false,"rollForward":"latestFeature"}}'
          actual=$(tr -d ' \n\r\t' < global.json)
          if [ "$actual" != "$expected" ]; then
            echo "global.json が基準（10.0.100 / latestFeature）と違う: $actual"
            exit 1
          fi
